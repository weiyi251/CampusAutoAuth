<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>校园网助手</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e1e21'/%3E%3Cg fill='none' stroke='%23f5f5f7' stroke-width='5.5' stroke-linecap='round'%3E%3Cpath d='M13 26a27 27 0 0 1 38 0'/%3E%3Cpath d='M19.5 34a17.5 17.5 0 0 1 25 0'/%3E%3Cpath d='M26 42a8.5 8.5 0 0 1 12 0'/%3E%3C/g%3E%3Ccircle cx='32' cy='50' r='4.5' fill='%23f5f5f7'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0c;
  --glass:rgba(255,255,255,.06);
  --glass-strong:rgba(255,255,255,.1);
  --glass-thin:rgba(255,255,255,.04);
  --line:rgba(255,255,255,.12);
  --line-soft:rgba(255,255,255,.08);
  --hi:rgba(255,255,255,.3);
  --txt:#f5f5f7; --dim:#a1a1a6; --faint:#6e6e73;
  --ok:#f5f5f7; --bad:#c7c7cc;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --r:16px; --r-pill:999px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;justify-content:center;padding:18px;position:relative;overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(680px 680px at 14% 8%, rgba(255,255,255,.10), transparent 60%),
    radial-gradient(760px 760px at 90% 92%, rgba(255,255,255,.08), transparent 60%),
    radial-gradient(460px 460px at 60% 48%, rgba(255,255,255,.06), transparent 60%);
}
.app{width:348px;max-width:100%;position:relative}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:40px;height:40px;border-radius:14px;flex:0 0 40px;
  background:var(--glass-strong);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tt{flex:1;min-width:0}
h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:600}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.status-pill{display:flex;align-items:center;gap:7px;
  font-size:12px;color:var(--dim);background:rgba(255,255,255,.05);
  border:1px solid var(--line-soft);border-radius:var(--r-pill);padding:6px 11px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.gear{width:36px;height:36px;flex:0 0 36px;border-radius:50%;
  background:var(--glass-strong);border:1px solid var(--line);color:var(--dim);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:.2s}
.gear:hover{background:rgba(255,255,255,.16);border-color:var(--hi);color:var(--txt)}
.gear:active{transform:scale(.94)}
.seg-btn{flex:1;border:0;background:transparent;color:var(--dim);font-size:14px;
  font-weight:600;font-family:inherit;padding:9px 0;border-radius:calc(var(--r) - 4px);
  cursor:pointer;transition:.2s;letter-spacing:.3px}
.seg-btn.active{background:rgba(255,255,255,.16);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.card{background:var(--glass);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:18px 20px;margin-bottom:14px;position:relative;
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--hi),transparent);border-radius:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.label{font-size:13px;color:var(--dim)}
.val{font-size:15px;font-weight:600;display:flex;align-items:center;gap:9px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint);animation:pulse 1.2s ease-in-out infinite}
.dot.on{background:var(--txt);box-shadow:0 0 10px rgba(255,255,255,.6);animation:none}
.dot.off{background:var(--faint);animation:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.btn{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:2px 0;
  font-size:16px;font-weight:600;letter-spacing:.3px;cursor:pointer;color:var(--txt);
  background:var(--glass-strong);box-shadow:var(--shadow);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  transition:transform .12s ease, background .2s, border-color .2s}
.btn:hover{background:rgba(255,255,255,.18);border-color:var(--hi)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.switch{position:relative;width:52px;height:28px;border-radius:var(--r-pill);flex:0 0 52px;
  background:rgba(255,255,255,.07);border:1px solid var(--line-soft);cursor:pointer;transition:.2s}
.switch.on{background:rgba(255,255,255,.22);border-color:var(--line)}
.knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--txt);transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on .knob{left:29px;background:var(--bg)}
.log{max-height:180px;overflow:auto;background:rgba(0,0,0,.3);
  border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;
  font-family:Consolas,"Cascadia Mono","Microsoft YaHei",monospace;font-size:11px;color:var(--dim);
  white-space:pre-wrap;line-height:1.7;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.log::-webkit-scrollbar{width:6px}
.log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:var(--r-pill)}
.log::-webkit-scrollbar-track{background:transparent}
.msg{margin:12px 2px 14px;font-size:13px;min-height:18px;color:var(--dim);
  border-radius:var(--r);padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft)}
.msg:empty,.credmsg:empty{background:transparent;border-color:transparent;padding-top:0;padding-bottom:0;margin:0}
.foot{margin-top:4px;font-size:11px;color:var(--faint);text-align:center;letter-spacing:.2px}
.sec{font-size:15px;font-weight:600;color:var(--txt);letter-spacing:.3px}
.hint{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7}
.ipt{width:100%;background:var(--glass-thin);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:13px 15px;color:var(--txt);font-size:14px;
  outline:none;margin-top:10px;font-family:inherit;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:border-color .2s, box-shadow .2s}
.ipt:focus{border-color:var(--hi);box-shadow:0 0 0 3px rgba(255,255,255,.14)}
.ipt::placeholder{color:var(--faint)}
.pwrow{position:relative}
.eye{position:absolute;right:10px;bottom:6px;border:0;background:transparent;
  color:var(--dim);font-size:13px;cursor:pointer;padding:6px;font-family:inherit}
.eye:hover{color:var(--txt)}
.btn2{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:13px;
  margin-top:14px;font-size:14px;font-weight:600;letter-spacing:.3px;cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--txt);font-family:inherit;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:.2s}
.btn2:hover{border-color:var(--hi);background:rgba(255,255,255,.1)}
.credmsg{font-size:13px;margin-top:10px;min-height:18px;text-align:center;color:var(--dim);
  border-radius:var(--r);padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid var(--line-soft)}
.modal{position:fixed;inset:0;display:flex;z-index:50;padding:20px;overflow-y:auto}
.modal[hidden]{display:none}
.modal-mask{position:absolute;inset:0;background:rgba(0,0,0,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal-card{position:relative;width:100%;max-width:400px;margin:auto;max-height:calc(100vh - 40px);
  display:flex;flex-direction:column;min-height:0;
  background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow);animation:pop .18s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex:0 0 auto}
.modal-close{width:32px;height:32px;border:0;background:rgba(255,255,255,.06);color:var(--dim);
  border-radius:50%;font-size:20px;line-height:1;cursor:pointer;font-family:inherit;transition:.2s}
.modal-close:hover{background:rgba(255,255,255,.16);color:var(--txt)}
.modal-body{flex:1 1 auto;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid var(--line-soft);
  border-radius:var(--r);padding:4px;margin-bottom:16px;flex:0 0 auto;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.page{display:block}
.page[hidden]{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="hd">
    <div class="logo">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#f5f5f7" stroke-width="2" stroke-linecap="round">
        <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <circle cx="12" cy="20" r="1.2" fill="#f5f5f7" stroke="none"/>
      </svg>
    </div>
    <div class="tt"><h1>校园网助手</h1><div class="sub">XCU 自动连接</div></div>
    <div class="status-pill"><span class="dot" id="dot"></span><span id="net">检测中…</span></div>
    <button class="gear" id="openSettings" aria-label="设置">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <button class="btn" id="connect">立即连接校园网</button>
  <div class="msg" id="msg"></div>

  <div class="card">
    <div class="label" style="margin-bottom:8px">运行日志</div>
    <div class="log" id="log">加载中…</div>
  </div>

  <div class="foot">本地运行，数据不出本机</div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-card">
    <div class="modal-hd">
      <div class="sec">设置</div>
      <button class="modal-close" id="closeSettings" aria-label="关闭">×</button>
    </div>
    <div class="modal-body">
    <div class="seg">
      <button class="seg-btn active" data-page="account">配置</button>
      <button class="seg-btn" data-page="pref">偏好</button>
    </div>

    <div class="page" id="page-account">
      <div class="row" style="margin-bottom:2px">
        <div class="sec">配置</div>
        <span class="label" id="credState"></span>
      </div>
      <div class="hint">修改后立即生效，下次连接即使用新配置。密码留空表示保持原密码不变。</div>

      <div class="card" style="margin:12px 0 4px">
        <div class="label" style="margin-bottom:10px">当前配置</div>
        <div class="row" style="margin-bottom:8px">
          <div class="label">账号</div>
          <div class="val" id="curUser">—</div>
        </div>
        <div class="row" style="margin-bottom:8px">
          <div class="label">密码</div>
          <div class="val"><span id="curPass">—</span>
            <button class="eye" id="eyeCur" type="button" style="position:static;bottom:auto;right:auto;padding:4px 6px">显示</button>
          </div>
        </div>
        <div class="row">
          <div class="label">校园网网址</div>
          <div class="val" id="curPortal">—</div>
        </div>
      </div>

      <input class="ipt" id="user" placeholder="新账号 / 学号" autocomplete="off" spellcheck="false">
      <div class="pwrow">
        <input class="ipt" id="pass" type="password" placeholder="新密码（留空则不修改）" autocomplete="off" spellcheck="false">
        <button class="eye" id="eye" type="button">显示</button>
      </div>
      <input class="ipt" id="portal" placeholder="校园网认证网址（留空则自动探测门户）" autocomplete="off" spellcheck="false" style="margin-top:10px">
      <button class="btn2" id="save">保存配置</button>
      <div class="credmsg" id="credMsg"></div>
    </div>

    <div class="page" id="page-pref" hidden>
      <div class="card" style="margin-bottom:14px">
        <div class="row">
          <div>
            <div style="font-size:15px;font-weight:600">开机自动连接</div>
            <div class="label" style="margin-top:4px">登录 Windows 后自动连网并认证</div>
          </div>
          <div class="switch" id="sw"><div class="knob"></div></div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div>
            <div style="font-size:15px;font-weight:600">连接后自动退出</div>
            <div class="label" style="margin-top:4px">连网成功后自动关闭此面板</div>
          </div>
          <div class="switch" id="swExit"><div class="knob"></div></div>
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="row">
          <div>
            <div style="font-size:15px;font-weight:600">软件版本 <span class="label" id="verNow"></span></div>
            <div class="label" id="updMsg" style="margin-top:4px">在线检查并升级到最新版</div>
          </div>
          <button class="btn2" id="checkUpd" style="margin:0;padding:8px 14px;font-size:13px">检查更新</button>
        </div>
      </div>
    </div>
    </div>
  </div>
</div>

<script>
const $ = function (id) { return document.getElementById(id); };
let auto = false;
let autoExit = (localStorage.getItem('xcu_autoclose') !== '0');
let curPassVal = '';

function mask(u){
  if (!u) return '未设置';
  if (u.length <= 4) return u;
  return u.slice(0, 2) + '****' + u.slice(-2);
}

async function status() {
  try {
    const r = await fetch('/api/status');
    const j = await r.json();
    $('dot').className = 'dot ' + (j.online ? 'on' : 'off');
    $('net').textContent = j.online ? '已联网' : '未联网';
    auto = j.auto;
    $('sw').classList.toggle('on', auto);
    if (j.username && document.activeElement !== $('user')) $('user').value = j.username;
    $('credState').textContent = j.hasPassword ? '当前 ' + mask(j.username) : '未设置密码';
    if (j.portal && document.activeElement !== $('portal')) $('portal').value = j.portal;
    // 当前配置展示
    $('curUser').textContent = j.username || '未设置';
    curPassVal = j.password || '';
    if (curPassVal) {
      $('curPass').textContent = '••••••';
      $('eyeCur').style.display = '';
      $('eyeCur').textContent = '显示';
    } else {
      $('curPass').textContent = '未设置';
      $('eyeCur').style.display = 'none';
    }
    $('curPortal').textContent = j.portal || '自动探测';
    $('verNow').textContent = j.version ? 'v' + j.version : '';
  } catch (e) {
    $('net').textContent = '服务未响应';
  }
}

async function loadLog() {
  try {
    const r = await fetch('/api/log');
    const j = await r.json();
    $('log').textContent = j.lines.length ? j.lines.join('\n') : '暂无日志';
    $('log').scrollTop = $('log').scrollHeight;
  } catch (e) {}
}

function showPage(p){
  ['account','pref'].forEach(function (n) { $('page-' + n).hidden = (n !== p); });
}
function openModal(page){
  const def = page || 'account';
  document.querySelectorAll('.seg-btn').forEach(function (x) {
    x.classList.toggle('active', x.dataset.page === def);
  });
  showPage(def);
  $('modal').hidden = false;
}
document.querySelectorAll('.seg-btn').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('.seg-btn').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    showPage(b.dataset.page);
  };
});
$('openSettings').onclick = function () { openModal('account'); };
$('closeSettings').onclick = function () { $('modal').hidden = true; };
$('modalMask').onclick = function () { $('modal').hidden = true; };

$('sw').onclick = async function () {
  auto = !auto;
  $('sw').classList.toggle('on', auto);
  try {
    await fetch('/api/auto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: auto })
    });
  } catch (e) {}
  status();
};

$('swExit').onclick = function () {
  autoExit = !autoExit;
  $('swExit').classList.toggle('on', autoExit);
  try { localStorage.setItem('xcu_autoclose', autoExit ? '1' : '0'); } catch (e) {}
};

$('eye').onclick = function () {
  const p = $('pass');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eye').textContent = show ? '隐藏' : '显示';
};

// 当前配置里的密码显隐：默认打码，点“显示”露出明文
$('eyeCur').onclick = function () {
  if ($('curPass').textContent === '••••••') {
    $('curPass').textContent = curPassVal;
    $('eyeCur').textContent = '隐藏';
  } else {
    $('curPass').textContent = '••••••';
    $('eyeCur').textContent = '显示';
  }
};

$('save').onclick = async function () {
  const b = $('save');
  b.disabled = true;
  b.textContent = '保存中…';
  $('credMsg').textContent = '';
  try {
    const r = await fetch('/api/cred', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: $('user').value.trim(), password: $('pass').value, portal: $('portal').value.trim() })
    });
    const j = await r.json();
    $('credMsg').textContent = j.ok ? '已保存，下次连接生效' : ('保存失败：' + (j.error || ''));
    $('credMsg').style.color = j.ok ? 'var(--ok)' : 'var(--bad)';
    if (j.ok) { $('pass').value = ''; status(); }
  } catch (e) {
    $('credMsg').textContent = '请求失败';
    $('credMsg').style.color = 'var(--bad)';
  }
  b.disabled = false;
  b.textContent = '保存配置';
};

$('connect').onclick = async function () {  const b = $('connect');
  b.disabled = true;
  b.textContent = '连接中…';
  $('msg').textContent = '';
  try {
    const r = await fetch('/api/connect', { method: 'POST' });
    const j = await r.json();
    if (j.online) {
      if (autoExit) {
        $('msg').style.color = 'var(--ok)';
        $('msg').textContent = '已联网，即将退出…';
        try { await fetch('/api/quit'); } catch (e) {}
        setTimeout(function () { window.close(); }, 700);
        return;
      }
      $('msg').style.color = 'var(--ok)';
      $('msg').textContent = '已成功联网';
    } else {
      $('msg').style.color = 'var(--bad)';
      $('msg').textContent = '未能联网，请查看日志';
    }
  } catch (e) {
    $('msg').style.color = 'var(--bad)';
    $('msg').textContent = '请求失败';
  }
  b.disabled = false;
  b.textContent = '立即连接校园网';
  status();
  loadLog();
};

$('swExit').classList.toggle('on', autoExit);
status();
loadLog();
setInterval(status, 10000);
setInterval(loadLog, 15000);

// —— 检查更新 ——
// updating=true 后跳过心跳与关窗通知：更新过程中旧页面若把 bye 发给已重启的新服务，会误杀新进程
let updating = false;
$('checkUpd').onclick = async function () {
  const b = $('checkUpd');
  if (b.disabled) return;
  b.disabled = true;
  b.textContent = '检查中…';
  $('updMsg').textContent = '正在检查更新…';
  try {
    const r = await fetch('/api/check_update');
    const j = await r.json();
    if (!j.ok) {
      $('updMsg').textContent = '检查失败：' + (j.error || '网络异常');
    } else if (!j.hasUpdate) {
      $('updMsg').textContent = '已是最新版本 v' + j.current;
    } else {
      const note = (j.notes || '').split('\n').filter(function (x) { return x.trim(); })[0] || '';
      $('updMsg').textContent = '发现新版本 v' + j.latest + (note ? '：' + note.slice(0, 40) : '');
      b.textContent = '一键更新';
      b.disabled = false;
      b.onclick = async function () {
        b.disabled = true;
        updating = true;
        $('updMsg').textContent = '正在下载更新，完成后应用将自动重启…';
        try {
          const r2 = await fetch('/api/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: j.url, digest: j.digest })
          });
          const j2 = await r2.json();
          if (j2.ok) {
            $('updMsg').textContent = '下载完成，应用即将自动重启并打开新窗口…';
          } else {
            updating = false;
            $('updMsg').textContent = '更新失败：' + (j2.error || '未知错误');
            b.textContent = '重试更新';
            b.disabled = false;
          }
        } catch (e) {
          updating = false;
          $('updMsg').textContent = '更新失败：网络异常';
          b.textContent = '重试更新';
          b.disabled = false;
        }
      };
      return;
    }
  } catch (e) {
    $('updMsg').textContent = '检查失败：网络异常';
  }
  b.disabled = false;
  b.textContent = '检查更新';
};

// 心跳：窗口存活时持续上报，server 据此在窗口关闭后自动退出，避免残留后台 node 进程
async function beat() { if (updating) return; try { await fetch('/api/heartbeat'); } catch (e) {} }
beat();
setInterval(beat, 4000);
// 关窗时主动通知 server 立即退出（sendBeacon 在卸载阶段仍可异步发送）
window.addEventListener('beforeunload', function () {
  if (updating) return;
  try { navigator.sendBeacon('/api/bye'); } catch (e) {}
});
</script>
